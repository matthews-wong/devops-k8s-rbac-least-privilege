apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-reader
  namespace: rbac-demo
  labels:
    app.kubernetes.io/name: app-reader
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: rbac-demo
    app.kubernetes.io/managed-by: kubectl
# Opt out at the account; pods that need the API opt back in explicitly.
automountServiceAccountToken: false
