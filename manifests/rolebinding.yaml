apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-reader
  namespace: rbac-demo
  labels:
    app.kubernetes.io/name: app-reader
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: rbac-demo
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-reader
subjects:
  - kind: ServiceAccount
    name: app-reader
    namespace: rbac-demo
