apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-reader
  namespace: rbac-demo
  labels:
    app.kubernetes.io/name: app-reader
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: rbac-demo
    app.kubernetes.io/managed-by: kubectl
rules:
  # resourceNames pins the grant to one object; list/watch cannot be
  # restricted this way, so they are deliberately not granted.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["app-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
